name: PR Build & Test

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          gradle assembleDebug testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Surface build errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          try:
              log = open('build.log', encoding='utf-8', errors='replace').read()
          except OSError:
              log = ''
          lines = log.splitlines()
          errors = [l for l in lines if l.startswith('e: ') or ' error:' in l]
          for l in errors[:25]:
              msg = l.replace('\r', '')
              print(f'::error::{msg[:2000]}')
          # One annotation with the failure context (readable via the checks API).
          idx = next((i for i, l in enumerate(lines) if 'What went wrong' in l or 'FAILURE:' in l), max(0, len(lines) - 80))
          context = '\n'.join(lines[idx:idx + 80])[:60000]
          if context:
              print('::error::Build failure context:%0A' + context.replace('\n', '%0A'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Build errors\n\n```\n' + '\n'.join(errors[:50]) + '\n```\n')
          PY

      # Actions artifact storage for this account is full (other repos). Do not upload
      # artifacts. Commit the debug APK onto the PR branch instead so it can be installed
      # from the repo. [skip ci] keeps that commit from starting another run.
      - name: Publish debug APK onto the branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cp "$apk" "$RUNNER_TEMP/apk/CurioAlarm-debug.apk"
          sha256sum "$RUNNER_TEMP/apk/CurioAlarm-debug.apk"
          rm -f build.log
          git fetch origin "${{ github.head_ref }}:${{ github.head_ref }}"
          git checkout "${{ github.head_ref }}"
          mkdir -p dist
          cp "$RUNNER_TEMP/apk/CurioAlarm-debug.apk" dist/CurioAlarm-debug.apk
          git add -f dist/CurioAlarm-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "Add installable debug APK [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
