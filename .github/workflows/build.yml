
name: Build CurioAlarm Signed Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project.zip if present
        run: |
          if [ -f project.zip ]; then
            unzip -q -o project.zip -x '.github/*'
            rm -f project.zip
          fi

      - name: Verify Android project
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "::error::No Gradle settings file found in repository root."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] && [ ! -f app/build.gradle ]; then
            echo "::error::No app Gradle build file found."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/curio-release.jks"

          test -s "$RUNNER_TEMP/curio-release.jks"
          chmod 600 "$RUNNER_TEMP/curio-release.jks"

      - name: Build signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/curio-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          gradle assembleRelease --stacktrace --no-daemon

      - name: Verify release APK exists
        run: |
          test -n "$(find app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' -print -quit)" \
            || { echo "::error::Release APK not found."; exit 1; }

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: CurioAlarm-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
